# Deploy a public demo to GitHub Pages (static site, demo mode)

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build demo
        env:
          VITE_APP_ENV: demo
          VITE_DEMO_MODE: 'true'
          VITE_SKIP_SETUP: 'true'
          VITE_DISABLE_PAYMENTS: 'true'
          VITE_DISABLE_ADMIN: 'true'
          # Project-site path today. For user-site root use VITE_BASE: '/'
          # after ADMIN completes docs/runbooks/GITHUB-PAGES-ROOT-MIGRATION.md
          VITE_BASE: '/zax-kodelex/'
        run: npm run build
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
